openapi: 3.0.3
info:
  title: Last Race Game API
  version: 1.0.0
  description: |
    OpenAPI definition for the "Last Race" backend application.

servers:
  - url: http://127.0.0.1:3001/api/v1
    description: Local dev server
security:
  - cookieAuth: []
tags:
  - name: auth
    description: User session and login operations
  - name: game
    description: Game logic
  - name: data
    description: Static game data

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie generated by Passport.js after successful login.
  
  schemas:
    Station:
      type: object
      description: A station in the underground metro network.
      required:
        - id
        - name
        - latitude
        - longitude
      properties:
        id:
          type: integer
          description: Unique numeric identifier, used as the row/column index in adjacency matrices.
          example: 1
        name:
          type: string
          example: "Centrale"
        latitude:
          type: number
          format: float
          example: 45.4654
        longitude:
          type: number
          format: float
          example: 9.1895

    Event:
      type: object
      description: A game event that occurs on a route segment, affecting the player's coin total.
      required:
        - id
        - name
        - description
        - effect
      properties:
        id:
          type: integer
          description: Unique numeric identifier of the event.
          example: 3
        name:
          type: string
          example: "Kind passenger"
        description:
          type: string
          example: "Kind passenger, +1 coin"
        effect:
          type: integer
          description: A positive or negative integer from -4 to +4.
          example: 1

    Line:
      type: object
      description: A metro line in the underground network.
      required:
        - id
        - name
        - color
      properties:
        id:
          type: integer
          description: Unique numeric identifier of the line.
          example: 2
        name:
          type: string
          example: "Red Line"
        color:
          type: string
          description: Hex color code representing the line on the map.
          example: "#ff0000"

    Subnetwork:
      type: object
      description: |
        Represents the adjacency matrix of a single metro line (identified by `line_id`).
        The matrix has dimension N×N, where N is the total number of stations in the entire underground network.
        Each cell adj_matrix[i][j] is indexed by station ID (row = station i, col = station j) and has a precise meaning based on the context:
        - **Base meaning** (used in GET /map and POST /game/execution request):
          - 1  → the segment between station i and station j exists on this line (or is part of the submitted route).
          - -1 → no segment between station i and station j on this line (or not part of the route).
        - **Event meaning** (used in POST /game/execution response):
          - event ID → the ID of the event applied to the segment from station i to station j.
          - -1 → the segment was not traversed.

        Stations, lines, and events are retrieved independently via GET /stations, GET /line, and GET /events.
      required:
        - line_id
        - adj_matrix
      properties:
        line_id:
          type: integer
          description: The ID of the metro line this adjacency matrix represents.
          example: 2
        adj_matrix:
          type: array
          items:
            type: array
            items:
              type: integer
          description: 2D integer matrix indexed by station ID.

    RankingEntry:
      type: object
      description: A single entry in the general ranking, representing a registered user's best score across all their games.
      required:
        - name
        - best_result
      properties:
        name:
          type: string
          example: "Mario Rossi"
        best_result:
          type: integer
          example: 24

    Endpoints:
      type: object
      description: The randomly assigned departure and arrival stations for the current game mission, returned in the planning phase.
      required:
        - departure_station_id
        - arrival_station_id
      properties:
        departure_station_id:
          type: integer
          example: 1
        arrival_station_id:
          type: integer
          example: 5

    LoginRequest:
      type: object
      description: Credentials submitted by the user to authenticate and start a session.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "mario@test.com"
        password:
          type: string
          format: password
          example: "password"

    UserResponse:
      type: object
      description: Profile data returned for an authenticated user.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mario Rossi"
        email:
          type: string
          example: "mario@test.com"

    ErrorResponse:
      type: object
      description: Standard structure for error responses.
      required:
        - code
        - message
        - name
      properties:
        code: 
          type: integer
          description: HTTP status code of the error.
          example: 401
        message:
          type: string
          description: Short error message.
          example: "Unauthorized"
        name:
          type: string
          description: Descriptive error name or details.


paths:
  /line:
    get:
      tags:
        - data
      summary: Get all metro lines
      description: Returns the list of all metro lines in the underground network.
      responses:
        '200':
          description: Lines retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Line'
              example:
                - id: 1
                  name: "Red Line"
                  color: "#ff0000"
                - id: 2
                  name: "Green Line"
                  color: "#008000"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /map:
    get:
      tags:
        - data
      summary: Get the underground network map
      description: |
        Returns the full underground network as an array of `Subnetwork` objects, one per metro line.
      responses:
        '200':
          description: Map retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subnetwork'
              example:
                - line_id: 1
                  adj_matrix:
                    - [-1,  1, -1]
                    - [ 1, -1,  1]
                    - [-1,  1, -1]
                - line_id: 2
                  adj_matrix:
                    - [-1, -1,  1]
                    - [-1, -1,  1]
                    - [ 1,  1, -1]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /stations:
    get:
      tags:
        - data
      summary: Get all stations
      description: Returns the list of all stations in the underground network.
      responses:
        '200':
          description: Stations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /events:
    get:
      tags:
        - data
      summary: Get all possible events
      description: Retrieves the list of all available events in the game.
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /ranking:
    get:
      tags:
        - game
      summary: Get general ranking
      description: Retrieves a list of users and their best results, sorted by score.
      responses:
        '200':
          description: Ranking retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankingEntry'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /game/planning/endpoints:
    get:
      tags:
        - game
      summary: Get a new mission (start/end stations)
      description: Assigns a random departure and arrival station with a minimum distance of 3 stops.
      responses:
        '200':
          description: Mission assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoints'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /game/execution:
    post:
      tags:
        - game
      summary: Execute the planned route
      description: |
        Validates the submitted route, applies random events to each segment, calculates the final score, and updates the user's best result.

        - **Request body**: an array of `Subnetwork` objects, one per metro line involved in the route.
        - **Response**: an array of `Subnetwork` objects with the same structure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Subnetwork'
            example:
              - line_id: 1
                adj_matrix:
                  - [-1,  1, -1]
                  - [ 1, -1,  1]
                  - [-1,  1, -1]
              - line_id: 2
                adj_matrix:
                  - [-1, -1, -1]
                  - [-1, -1,  1]
                  - [-1,  1, -1]
      responses:
        '200':
          description: Route executed successfully. Returns an array of Subnetworks annotated with the IDs of the applied events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subnetwork'
              example:
                - line_id: 1
                  adj_matrix:
                    - [-1,  3, -1]
                    - [ 3, -1,  7]
                    - [-1,  7, -1]
                - line_id: 2
                  adj_matrix:
                    - [-1, -1, -1]
                    - [-1, -1,  2]
                    - [-1,  2, -1]
        '400':
          description: Invalid route submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                message: "Invalid route submitted"
                name: "InvalidRoute"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /session:
    post:
      tags:
        - auth
      summary: Login user
      description: Authenticates a user and establishes a session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Invalid credentials"
                name: "InvalidCredentials"

  /session/current:
    get:
      tags:
        - auth
      summary: Get current user session
      description: Check if the user is still logged in and returns their profile.
      responses:
        '200':
          description: User is authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

    delete:
      tags:
        - auth
      summary: Logout user
      description: Destroys the current user session.
      responses:
        '204':
          description: Logout successful (No Content)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"
