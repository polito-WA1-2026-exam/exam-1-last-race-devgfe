openapi: 3.0.3
info:
  title: Last Race Game API
  version: 1.0.0
  description: |
    OpenAPI definition for the "Last Race" backend application.

servers:
  - url: http://127.0.0.1:5173/api/v1
    description: Local dev server
security:
  - cookieAuth: []
tags:
  - name: auth
    description: User session and login operations
  - name: game
    description: Core game logic
  - name: data
    description: Static game data

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie generated by Passport.js after successful login.
  
  schemas:
    Event:
      type: object
      description: A game event that occurs on a route segment, affecting the player's coin total.
      required:
        - name
        - description
        - effect
      properties:
        name:
          type: string
          example: "Kind passenger"
        description:
          type: string
          example: "A kind passenger offers you a coin."
        effect:
          type: integer
          description: A positive or negative integer from -4 to +4.
          example: 1

    Network:
      type: object
      description: Represents the underground metro network as a list of stations and a binary adjacency matrix. Reused as the request body for route submission (POST /game/execution), where the list of stations contains only those included in the chosen path, and the matrix encodes exclusively the selected route segments.
      required:
        - stations
        - adj_matrix
      properties:
        stations:
          type: array
          items:
            type: string
          description: List of station names. The index in this array corresponds to the row/col index in the adjacency matrix.
          example: ["Centrale", "Porta Velaria", "Torre Cinerea"]
        adj_matrix:
          type: array
          items:
            type: array
            items:
              type: integer
          description: 2D adjacency matrix where 1 indicates a connection between two stations and 0 indicates no connection.
          example: 
            - [0, 1, 0]
            - [1, 0, 1]
            - [0, 1, 0]

    ExecutionResponse:
      type: object
      description: Result of executing a submitted route. Contains the stations involved, an event-annotated adjacency matrix, and the list of events that were applied.
      required:
        - stations
        - adj_matrix
        - events
      properties:
        stations:
          type: array
          items:
            type: string
          description: List of station names part of the selected route. The index in this array corresponds to the row/col index in the adjacency matrix.
        adj_matrix:
          type: array
          items:
            type: array
            items:
              type: integer
          description: 2D array where each cell contains an integer. A value >= 0 indicates a connection and represents the index of the applied event from the `events` array (e.g., 3 means the 4th event), while a value of -1 indicates the absence of a connection.
          example: 
            - [-1, 5, 8]
            - [1, 6, -1]
            - [0, 3, 2]
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          description: List of events that were randomly selected and applied during the route execution.

    RankingEntry:
      type: object
      description: A single entry in the general ranking, representing a registered user's best score across all their games.
      required:
        - name
        - best_result
      properties:
        name:
          type: string
          example: "Mario Rossi"
        best_result:
          type: integer
          example: 24

    MissionEndpoints:
      type: object
      description: The randomly assigned departure and arrival stations for the current game mission, returned in the planning phase.
      required:
        - departure_station_name
        - arrival_station_name
      properties:
        departure_station_name:
          type: string
          example: "Centrale"
        arrival_station_name:
          type: string
          example: "Campo dell'Eco"

    LoginRequest:
      type: object
      description: Credentials submitted by the user to authenticate and start a session.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "mario@test.com"
        password:
          type: string
          format: password
          example: "password123"

    UserResponse:
      type: object
      description: Profile data returned for an authenticated user.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mario Rossi"
        email:
          type: string
          example: "mario@test.com"

    ErrorResponse:
      type: object
      description: Standard structure for error responses.
      required:
        - code
        - message
        - name
      properties:
        code: 
          type: integer
          description: HTTP status code of the error.
          example: 401
        message:
          type: string
          description: Short error message.
          example: "Unauthorized"
        name:
          type: string
          description: Descriptive error name or details.


paths:
  /network:
    get:
      tags:
        - data
      summary: Get the underground network map
      description: Returns the list of stations and the adjacency matrix representing the connections.
      responses:
        '200':
          description: Network retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /events:
    get:
      tags:
        - data
      summary: Get all possible events
      description: Retrieves the list of all available events in the game.
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /ranking:
    get:
      tags:
        - data
      summary: Get general ranking
      description: Retrieves a list of users and their best results, sorted by score.
      responses:
        '200':
          description: Ranking retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankingEntry'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /game/planning/endpoints:
    get:
      tags:
        - game
      summary: Get a new mission (start/end stations)
      description: Assigns a random departure and arrival station with a minimum distance of 3 stops.
      responses:
        '200':
          description: Mission assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionEndpoints'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /game/execution:
    post:
      tags:
        - game
      summary: Execute the planned route
      description: Validates the submitted route, applies random events to each segment, calculates the final score, and updates the user's best result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Network'
      responses:
        '200':
          description: Route executed successfully. Returns the matrix with event indices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '400':
          description: Invalid route submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                message: "Invalid route submitted"
                name: "InvalidRoute"
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

  /session:
    post:
      tags:
        - auth
      summary: Login user
      description: Authenticates a user and establishes a session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Invalid credentials"
                name: "InvalidCredentials"

  /session/current:
    get:
      tags:
        - auth
      summary: Get current user session
      description: Check if the user is still logged in and returns their profile.
      responses:
        '200':
          description: User is authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"

    delete:
      tags:
        - auth
      summary: Logout user
      description: Destroys the current user session.
      responses:
        '204':
          description: Logout successful (No Content)
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authorization header missing"
                name: "UnauthorizedError"
