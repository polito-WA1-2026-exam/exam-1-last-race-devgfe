openapi: 3.0.3
info:
  title: Last Race Game API
  version: 1.0.0
  description: |
    OpenAPI definition for the "Last Race" backend application.

servers:
  - url: http://127.0.0.1:3001/api/v1
    description: Local dev server
security:
  - cookieAuth: []
tags:
  - name: auth
    description: Authentication and session management
  - name: metro
    description: Metro network data — stations, lines and map
  - name: events
    description: Game events catalog
  - name: ranking
    description: Global ranking
  - name: game
    description: Game logic

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie generated by Passport.js after successful login.
  
  schemas:
    Station:
      type: object
      description: A station in the underground metro network.
      required:
        - id
        - name
        - latitude
        - longitude
      properties:
        id:
          type: integer
          description: Unique numeric identifier of the station.
          example: 1
        name:
          type: string
          example: "Centrale Fs"
        latitude:
          type: number
          format: float
          example: 45.48480550073354
        longitude:
          type: number
          format: float
          example: 9.202730068822738

    Event:
      type: object
      description: A game event that occurs on a route segment, affecting the player's coin total.
      required:
        - id
        - name
        - description
        - effect
      properties:
        id:
          type: integer
          description: Unique numeric identifier of the event.
          example: 3
        name:
          type: string
          example: "Kind passenger"
        description:
          type: string
          example: "Kind passenger, +1 coin"
        effect:
          type: integer
          description: A positive or negative integer from -4 to +4.
          example: 1

    Line:
      type: object
      description: A metro line in the underground network.
      required:
        - id
        - name
        - color
      properties:
        id:
          type: integer
          description: Unique numeric identifier of the line.
          example: 2
        name:
          type: string
          example: "Red Line"
        color:
          type: string
          description: Hex color code representing the line on the map.
          example: "#ff0000"

    Segment:
      type: object
      description: |
        A directional connection from one station to an adjacent station on a specific metro line.
        Station details can be retrieved via `GET /metro/stations` and line details via `GET /metro/lines`.
      required:
        - from_station_id
        - to_station_id
        - line_id
      properties:
        from_station_id:
          type: integer
          description: ID of the departure station for this segment.
          example: 3
        to_station_id:
          type: integer
          description: ID of the arrival station for this segment.
          example: 5
        line_id:
          type: integer
          description: ID of the metro line used for this segment.
          example: 2
        event:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Event'

    RankingEntry:
      type: object
      description: A single entry in the general ranking, representing a registered user's best score across all their games.
      required:
        - name
        - best_result
      properties:
        name:
          type: string
          example: "Mario Rossi"
        best_result:
          type: integer
          example: 6

    Endpoints:
      type: object
      description: The randomly assigned departure and arrival stations for the current game mission.
      required:
        - departure_station_id
        - arrival_station_id
      properties:
        departure_station_id:
          type: integer
          example: 1
        arrival_station_id:
          type: integer
          example: 5

    LoginRequest:
      type: object
      description: Credentials submitted by the user to authenticate and start a session.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "mario@test.com"
        password:
          type: string
          format: password
          example: "password"

    UserResponse:
      type: object
      description: Profile data returned for an authenticated user.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mario Rossi"
        email:
          type: string
          example: "mario@test.com"
        best_score:
          type: integer
          nullable: true
          example: 6

    ErrorResponse:
      type: object
      description: Standard structure for error responses.
      required:
        - code
        - message
        - name
      properties:
        code: 
          type: integer
          description: HTTP status code of the error.
          example: 401
        message:
          type: string
          description: Short error message.
          example: "Unauthorized"
        name:
          type: string
          description: Descriptive error name or details.


paths:
  /metro/lines:
    get:
      tags:
        - metro
      summary: Get all metro lines
      description: Returns the list of all metro lines in the underground network.
      responses:
        '200':
          description: Lines retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Line'
              example:
                - id: 1
                  name: "Red Line"
                  color: "#ff0000"
                - id: 2
                  name: "Green Line"
                  color: "#008000"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Not authenticated"
                name: "UnauthorizedError"

  /metro/segments:
    get:
      tags:
        - metro
      summary: Get the underground network map
      description: |
        Returns the full underground network as a list of `Segment` objects, representing all existing connections between adjacent stations across all metro lines.
      responses:
        '200':
          description: Map retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Segment'
              example:
                - from_station_id: 1
                  to_station_id: 2
                  line_id: 1
                - from_station_id: 2
                  to_station_id: 3
                  line_id: 1
                - from_station_id: 2
                  to_station_id: 4
                  line_id: 2
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Not authenticated"
                name: "UnauthorizedError"

  /metro/stations:
    get:
      tags:
        - metro
      summary: Get all stations
      description: Returns the list of all stations in the underground network.
      responses:
        '200':
          description: Stations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Not authenticated"
                name: "UnauthorizedError"

  /events:
    get:
      tags:
        - events
      summary: Get all possible events
      description: Retrieves the list of all available events in the game.
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Not authenticated"
                name: "UnauthorizedError"

  /ranking:
    get:
      tags:
        - ranking
      summary: Get general ranking
      description: Retrieves a list of users and their best results, sorted in descending order by score.
      responses:
        '200':
          description: Ranking retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankingEntry'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Not authenticated"
                name: "UnauthorizedError"

  /games:
    post:
      tags:
        - game
      summary: Create a new mission (start/end stations)
      description: Creates a new game session by randomly assigning a departure and arrival station with a minimum distance of 3 segments.
      responses:
        '201':
          description: Mission created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoints'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Not authenticated"
                name: "UnauthorizedError"

  /games/current/route:
    post:
      tags:
        - game
      summary: Execute the planned route
      description: |
        Validates the submitted route, applies a random event to each segment, calculates the final score, and saves the game record.

        - **Request body**: an ordered array of `Segment` objects representing the planned route. The order reflects exactly the sequence of segments as the player chose to build the route (from departure to arrival).
        - **Response**: the same ordered array of `Segment` objects, each enriched with the full `event` object applied to that segment. The order is preserved from the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Segment'
            example:
              - from_station_id: 1
                to_station_id: 2
                line_id: 1
              - from_station_id: 2
                to_station_id: 3
                line_id: 1
              - from_station_id: 3
                to_station_id: 5
                line_id: 2
      responses:
        '200':
          description: Route executed successfully. Returns the route segments each enriched with the applied event object.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Segment'
              example:
                - from_station_id: 1
                  to_station_id: 2
                  line_id: 1
                  event:
                    id: 3
                    name: "Kind passenger"
                    description: "Kind passenger, +1 coin"
                    effect: 1
                - from_station_id: 2
                  to_station_id: 3
                  line_id: 1
                  event:
                    id: 9
                    name: "Dirty floor"
                    description: "Dirty floor, -1 coin"
                    effect: -1
                - from_station_id: 3
                  to_station_id: 5
                  line_id: 2
                  event:
                    id: 8
                    name: "Air conditioning that works"
                    description: "Air conditioning that works, +2 coins"
                    effect: 2
        '400':
          description: Invalid route submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                message: "Invalid route submitted"
                name: "InvalidRoute"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Not authenticated"
                name: "UnauthorizedError"

  /session:
    post:
      tags:
        - auth
      summary: Login user
      description: Authenticates a user and establishes a session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Invalid credentials"
                name: "InvalidCredentials"

  /session/current:
    get:
      tags:
        - auth
      summary: Get current user session
      description: Check if the user is still logged in and returns their profile.
      responses:
        '200':
          description: User is authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Not authenticated"
                name: "UnauthorizedError"

    delete:
      tags:
        - auth
      summary: Logout user
      description: Destroys the current user session.
      responses:
        '204':
          description: Logout successful (No Content)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Not authenticated"
                name: "UnauthorizedError"
