name: Server CI Pipeline

on:
  push:
    branches: [ main ]
    paths: [ 'server/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'server/**' ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: 'server/package-lock.json'

    - name: Install server dependencies
      run: |
        cd server
        npm install

    - name: Run tests
      run: |
        cd server
        npm test